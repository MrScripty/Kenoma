name: Kenoma scoped educational reader
on:
  workflow_dispatch:
    inputs:
      publish:
        description: Deploy only the complete qualified functional root
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: reading-edition-${{ github.ref }}
  cancel-in-progress: false
jobs:
  reader:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    permissions:
      contents: read
      actions: read
    env:
      PYTHONDONTWRITEBYTECODE: '1'
      KENOMA_READING_OUTPUT: ${{ runner.temp }}/kenoma-reading
      XDG_CACHE_HOME: ${{ runner.temp }}/kenoma-reading-cache
      PLAYWRIGHT_BROWSERS_PATH: ${{ runner.temp }}/kenoma-reading-browsers
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          ref: ${{ github.sha }}
          fetch-depth: 0
          persist-credentials: false
      - name: Fetch fixed historical and scientific Git inputs
        run: |
          git fetch --no-tags origin main review/architecture-force-book-20261008 handoff/kenoma-source-through-ba11-20261008
          git fetch --no-tags origin 596df78f5cb652b4ac70917a82d8aa908b617056 6a72e01b66e4d5724c8d6c74f98cf38a90b21e31 f9dbda932264cb0ce1023b0204efe6e4057ed983
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: '24.19.0'
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065
        with:
          python-version: '3.12.14'
      - name: Install only scoped rendering and mathematical audit dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y pandoc=3.1.3+ds-2 fonts-liberation=1:2.1.5-3 fonts-dejavu-core=2.37-8 fonts-dejavu-extra=2.37-8 fontconfig
          python3 -m pip install -r education/reading-requirements.lock
          python3 -m pip install -r education/functional-requirements.lock
          python3 -m playwright install --with-deps chromium
      - name: Install only pinned static bundler dependencies without lifecycle scripts
        run: |
          mkdir "$RUNNER_TEMP/static-dependencies"
          git show 596df78f5cb652b4ac70917a82d8aa908b617056:education/package.json > "$RUNNER_TEMP/static-dependencies/package.json"
          git show 596df78f5cb652b4ac70917a82d8aa908b617056:education/package-lock.json > "$RUNNER_TEMP/static-dependencies/package-lock.json"
          npm ci --ignore-scripts --prefix "$RUNNER_TEMP/static-dependencies"
      - name: Reject tracked generated outputs
        run: python3 education/tools/check_generated_outputs.py
      - name: Seal fixed source/setup inputs and build the reader
        run: |
          python3 education/tools/source_first_reading.py seal "$RUNNER_TEMP/reading-inputs.json"
          python3 education/tools/source_first_reading.py build "$RUNNER_TEMP/reading-inputs.json" "$KENOMA_READING_OUTPUT"
          python3 education/tools/functional_pages.py seal "$RUNNER_TEMP/functional-inputs.json" --node-modules "$RUNNER_TEMP/static-dependencies/node_modules"
          python3 education/tools/functional_pages.py build "$RUNNER_TEMP/functional-inputs.json" "$KENOMA_READING_OUTPUT/reader" "$RUNNER_TEMP/functional-output" --node-modules "$RUNNER_TEMP/static-dependencies/node_modules"
      - name: Upload qualified reader
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scoped-reader-${{ github.sha }}
          path: ${{ runner.temp }}/kenoma-reading/reader/
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload qualified complete functional root
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: functional-root-${{ github.sha }}
          path: ${{ runner.temp }}/functional-output/pages/
          include-hidden-files: true
          if-no-files-found: error
      - name: Upload the complete preserved root plus scoped reader
        if: inputs.publish
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa
        with:
          path: ${{ runner.temp }}/functional-output/pages/
      - name: Preserve sanitized diagnostics
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: scoped-reader-diagnostics-${{ github.sha }}
          path: |
            ${{ runner.temp }}/kenoma-reading/ci-diagnostics/
            ${{ runner.temp }}/reading-inputs.json
            ${{ runner.temp }}/functional-output/ci-diagnostics/
            ${{ runner.temp }}/functional-inputs.json
          include-hidden-files: true
  deploy:
    if: inputs.publish
    needs: reader
    runs-on: ubuntu-24.04
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e
